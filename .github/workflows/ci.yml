name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    # dorny/test-reporter publishes results as check runs
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare Prisma config
        # prisma.config.ts loads DATABASE_URL via dotenv; a dummy value is
        # sufficient for `prisma generate` (no DB connection required).
        run: cp .env.example .env

      - name: Generate Prisma client
        run: npm run generate:prisma

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Vitest Test Report
          path: backend/test-results/junit.xml
          # There is no plain 'junit' reporter: 'jest-junit' is the parser for
          # generic JUnit XML (vitest's junit reporter emits the same schema).
          reporter: jest-junit

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Jest Test Report
          path: frontend/test-results/junit.xml
          reporter: jest-junit
