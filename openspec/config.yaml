schema: spec-driven

# Per-artifact rules (project-wide).
rules:
  tasks:
    - >-
      Не дробить задачи tasks.md на мелкие шаги. Каждая задача — законченный
      содержательный кусок работы (порядка 100+ строк реальной реализации)
      вместе со своими тестами и документацией, а не один микро-шаг.
    - >-
      Две близкие реализации (например, по ~100 строк каждая), относящиеся к
      одной логической области или правилу одного файла, объединять в одну
      задачу; related-правки одного файла/модуля/сущности — тоже в одну задачу.
    - >-
      Не плодить отдельные задачи вида «создать файл X», «добавить метод Y»,
      «написать тест Z» — сворачивать их в задачу, которая целиком реализует
      фичу и проверяет её. При этом задача должна оставаться выполнимой за одну
      сессию и обязательной явной проверкой (тест/команда/наблюдаемое поведение).
    - >-
      Ориентир: лучше заметно меньше, но крупных задач, чем много мелких чекбоксов.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
