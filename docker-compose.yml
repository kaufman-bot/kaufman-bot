services:
  db:
    image: pgvector/pgvector:pg18
    container_name: kaufman-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaufman
      POSTGRES_PASSWORD: kaufman
      POSTGRES_DB: kaufman_bot
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - kaufman_bot_postgres_volume:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kaufman -d kaufman_bot']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    # Официальные образы MinIO сняты с публичной раздачи: анонимный pull
    # minio/minio с Docker Hub и с quay.io даёт «pull access denied», репозиторий
    # заархивирован. Взят последний публично тянущийся (в том числе анонимно)
    # build того же minio из legacy-каталога Bitnami — 2025.7.23, он свежее,
    # чем их `latest` (2025.5.24). Проверено: /minio/health/live, консоль и S3 put/get.
    image: docker.io/bitnamilegacy/minio:2025.7.23-debian-12-r0
    container_name: kaufman-bot-minio
    # Образ по умолчанию работает под uid 1001, а /data в томе создан владельцем
    # root (его записывал предыдущий образ): без user: root minio не может
    # инициализировать .minio.sys и падает с «file access denied».
    user: root
    restart: unless-stopped
    # Entrypoint Bitnami специально поддерживает такой формат: если первый аргумент
    # «server», он исполняет `minio server …`, поэтому команда та же, что и с
    # официальным образом.
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - '29000:9000' # S3 API (MCP connects here)
      - '29001:9001' # Web Console
    volumes:
      - kaufman_bot_minio_volume:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -f http://localhost:9000/minio/health/live || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  kaufman_bot_postgres_volume:
  kaufman_bot_minio_volume:
