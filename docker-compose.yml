services:
  db:
    image: pgvector/pgvector:pg18
    container_name: kaufman-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaufman
      POSTGRES_PASSWORD: kaufman
      POSTGRES_DB: kaufman_bot
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - kaufman_bot_postgres_volume:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kaufman -d kaufman_bot']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: kaufman-bot-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - '29000:9000' # S3 API (MCP connects here)
      - '29001:9001' # Web Console
    volumes:
      - kaufman_bot_minio_volume:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -f http://localhost:9000/minio/health/live || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  kaufman_bot_postgres_volume:
  kaufman_bot_minio_volume:
